<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Term Webcam Terminal</title>
<style>
body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; padding: 20px; }
.container { max-width: 800px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; }
button { background-color: #0078D7; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; }
button:hover { background-color: #005A9E; }
button:disabled { background-color: #555; cursor: not-allowed; }
#webcam-container { margin-top: 20px; display: none; text-align: center; }
img { max-width: 100%; border-radius: 8px; border: 2px solid #444; }
.status { margin-top: 10px; color: #00ff00; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<h2>K-Term Web Terminal</h2>
<p>Remote Hardware & Camera Console</p>

<button id="btnCapture" onclick="requestWebcam()">📸 Capture Webcam Photo</button>
<div id="statusMsg" class="status"></div>

<div id="webcam-container">
<h3>Latest Capture:</h3>
<img id="webcam-image" src="" alt="Webcam Photo">
</div>
</div>

<script>
const API_BASE = window.location.pathname.startsWith('/lap') ? '/lap/api' : '/api';
let authToken = localStorage.getItem('kterm_lap_token') || '';

function normalizeMediaUrl(url) {
    if (!url) return '';
    if (url.startsWith('data:') || url.startsWith('blob:') || url.startsWith('http://') || url.startsWith('https://')) return url;
    let finalUrl = url;
    if (url.startsWith('/lap/')) finalUrl = url;
    else if (url.startsWith('/uploads/')) finalUrl = '/lap' + url;
    else if (url.startsWith('uploads/')) finalUrl = '/lap/' + url;
    else finalUrl = '/lap/' + url.replace(/^\/+/, '');
    if (authToken && finalUrl.includes('/uploads/') && !finalUrl.includes('token=')) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(authToken);
    }
    return finalUrl;
}

async function checkAuth() {
    if (!authToken) {
        const pwd = prompt('Access Password එක ඇතුළත් කරන්න:');
        if (!pwd) {
            document.body.innerHTML = '<div style="max-width:500px; margin:50px auto; background:#222; padding:30px; border-radius:8px; text-align:center;"><h2 style="color:#ef4444;">🔒 Access Denied</h2><p>Password is required to access webcam console.</p><button onclick="location.reload()" style="background:#0078D7; color:#fff; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Retry Login</button></div>';
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json();
            if (data.success && data.token) {
                authToken = data.token;
                localStorage.setItem('kterm_lap_token', authToken);
                initSSE();
            } else {
                alert(data.error || 'Password වැරදියි!');
                location.reload();
            }
        } catch(e) {
            alert('Connection error. Please retry.');
        }
    } else {
        initSSE();
    }
}

let eventSource = null;
function initSSE() {
    if (!authToken) return;
    if (eventSource) {
        try { eventSource.close(); } catch(e) {}
    }
    eventSource = new EventSource(`${API_BASE}/events?token=` + encodeURIComponent(authToken));
    eventSource.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            if (data.type === 'webcam_update') {
                document.getElementById('webcam-image').src = normalizeMediaUrl(data.url);
                document.getElementById('webcam-container').style.display = 'block';
                document.getElementById('statusMsg').innerText = "Photo received successfully!";
                document.getElementById('btnCapture').disabled = false;
            }
        } catch(e) {}
    };
    eventSource.onerror = function() {
        // Token expired or invalid
    };
}

checkAuth();

// 2. කැමරාව අල්ලන්න කමාන්ඩ් එක යැවීම
function requestWebcam() {
    if (!authToken) { checkAuth(); return; }
    const btn = document.getElementById('btnCapture');
    const status = document.getElementById('statusMsg');

    btn.disabled = true;
    status.innerText = "Sending command to remote PC... Please wait.";
    status.style.color = "yellow";

    clearTimeout(window.webcamTimeout);
    window.webcamTimeout = setTimeout(() => {
        if (btn.disabled) {
            btn.disabled = false;
            status.innerText = "No response from webcam. Please check if camera is connected and agent is running.";
            status.style.color = "orange";
        }
    }, 15000);

    fetch(`${API_BASE}/command?token=` + encodeURIComponent(authToken), {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({ command: 'webcam' })
    })
    .then(response => {
        if (response.status === 401) {
            localStorage.removeItem('kterm_lap_token');
            authToken = '';
            checkAuth();
            throw new Error('Unauthorized');
        }
        return response.json();
    })
    .then(data => {
        status.innerText = "Command sent. Waiting for image...";
    })
    .catch(error => {
        clearTimeout(window.webcamTimeout);
        status.innerText = error.message === 'Unauthorized' ? "Authentication failed!" : "Error sending command!";
        status.style.color = "red";
        btn.disabled = false;
    });
}
</script>

</body>
</html>
